<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="omniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090812" />
      <stop offset="100%" stop-color="#111120" />
    </linearGradient>
    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B77AFF" />
      <stop offset="100%" stop-color="#691ECE" />
    </linearGradient>
    <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 53, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(139, 53, 255, 0)" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#omniBg)" stroke="#27233E" stroke-width="1.5" />

  <!-- App Header -->
  <rect width="800" height="46" rx="16" fill="#121021" />
  <rect y="34" width="800" height="12" fill="#121021" />
  <line x1="0" y1="46" x2="800" y2="46" stroke="#221E38" stroke-width="1" />
  <text x="25" y="28" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">OMNI<tspan fill="#8B35FF">METRIC</tspan></text>
  <rect x="180" y="11" width="220" height="24" rx="6" fill="#1A172C" />
  <text x="200" y="27" fill="#6F6D8A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Search telemetry, clusters...</text>

  <!-- User profile right -->
  <circle cx="750" cy="23" r="13" fill="#8B35FF" />
  <text x="750" y="27" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">NX</text>
  <circle cx="715" cy="23" r="8" fill="#1F1B35" />

  <!-- Sidebar -->
  <rect x="0" y="46" width="160" height="454" fill="#0E0D1B" />
  <line x1="160" y1="46" x2="160" y2="500" stroke="#221E38" stroke-width="1" />
  
  <rect x="12" y="65" width="136" height="30" rx="6" fill="#231A3F" stroke="#4C2D8E" stroke-width="1" />
  <text x="35" y="84" fill="#D8B4FE" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Overview</text>
  
  <text x="35" y="120" fill="#807E9C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Live Telemetry</text>
  <text x="35" y="152" fill="#807E9C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Active Clusters</text>
  <text x="35" y="184" fill="#807E9C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Security Events</text>
  <text x="35" y="216" fill="#807E9C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">API Gateways</text>
  <text x="35" y="248" fill="#807E9C" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Cost Optimizer</text>

  <!-- Dashboard Main Area -->
  <!-- 3 KPI Cards -->
  <rect x="180" y="65" width="185" height="90" rx="10" fill="#141224" stroke="#27233F" stroke-width="1" />
  <text x="195" y="90" fill="#8A88A4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Total Throughput</text>
  <text x="195" y="122" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22">4.18M req/s</text>
  <text x="195" y="142" fill="#22C55E" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">↑ +14.2% vs avg</text>

  <rect x="380" y="65" width="185" height="90" rx="10" fill="#141224" stroke="#27233F" stroke-width="1" />
  <text x="395" y="90" fill="#8A88A4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">System Health</text>
  <text x="395" y="122" fill="#22C55E" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22">99.98%</text>
  <text x="395" y="142" fill="#B77AFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">All 64 nodes green</text>

  <rect x="580" y="65" width="190" height="90" rx="10" fill="#141224" stroke="#27233F" stroke-width="1" />
  <text x="595" y="90" fill="#8A88A4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">P99 Edge Latency</text>
  <text x="595" y="122" fill="#B77AFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="22">12.4 ms</text>
  <text x="595" y="142" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Optimized with Rust</text>

  <!-- Big Interactive Chart Panel -->
  <rect x="180" y="170" width="385" height="195" rx="10" fill="#141224" stroke="#27233F" stroke-width="1" />
  <text x="195" y="195" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Bandwidth & Traffic Dynamics</text>
  
  <path d="M 195 320 Q 240 310, 280 270 T 360 250 T 430 220 T 500 240 T 545 200 L 545 340 L 195 340 Z" fill="url(#areaGradient)" />
  <path d="M 195 320 Q 240 310, 280 270 T 360 250 T 430 220 T 500 240 T 545 200" fill="none" stroke="#8B35FF" stroke-width="3" />
  <circle cx="545" cy="200" r="5" fill="#C084FC" />

  <!-- Right Side Distribution Widget -->
  <rect x="580" y="170" width="190" height="195" rx="10" fill="#141224" stroke="#27233F" stroke-width="1" />
  <text x="595" y="195" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Geographic Traffic</text>
  <rect x="595" y="215" width="160" height="10" rx="5" fill="#201C38" />
  <rect x="595" y="215" width="110" height="10" rx="5" fill="#8B35FF" />
  <text x="595" y="240" fill="#8A88A4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">North America (68%)</text>

  <rect x="595" y="255" width="160" height="10" rx="5" fill="#201C38" />
  <rect x="595" y="255" width="70" height="10" rx="5" fill="#B77AFF" />
  <text x="595" y="280" fill="#8A88A4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Europe & UK (44%)</text>

  <rect x="595" y="295" width="160" height="10" rx="5" fill="#201C38" />
  <rect x="595" y="295" width="45" height="10" rx="5" fill="#A855F7" />
  <text x="595" y="320" fill="#8A88A4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Asia-Pacific (28%)</text>

  <!-- Bottom Log Feed -->
  <rect x="180" y="380" width="590" height="100" rx="10" fill="#141224" stroke="#27233F" stroke-width="1" />
  <text x="195" y="405" fill="#8B35FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">LIVE SYSTEM LOGS</text>
  <text x="195" y="430" fill="#A19EBF" font-family="'Space Grotesk', monospace" font-size="11">[10:42:01] Edge cluster 'us-east-1' rebalanced 24,000 queries in 4ms.</text>
  <text x="195" y="455" fill="#A19EBF" font-family="'Space Grotesk', monospace" font-size="11">[10:42:05] Security firewall verified 100% token signature authenticity.</text>
</svg>
