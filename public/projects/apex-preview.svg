<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E18" />
      <stop offset="100%" stop-color="#17172A" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B77AFF" />
      <stop offset="100%" stop-color="#8B35FF" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 53, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(139, 53, 255, 0.0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" stroke="#27253D" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect width="800" height="42" rx="16" fill="#11111E" />
  <rect y="30" width="800" height="12" fill="#11111E" />
  <line x1="0" y1="42" x2="800" y2="42" stroke="#252438" stroke-width="1" />
  <circle cx="28" cy="21" r="5" fill="#FF5F56" />
  <circle cx="46" cy="21" r="5" fill="#FFBD2E" />
  <circle cx="64" cy="21" r="5" fill="#27C93F" />
  <rect x="240" y="10" width="320" height="22" rx="6" fill="#1A192D" />
  <text x="400" y="25" fill="#8E8DA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">apex-enterprise.global/investors</text>

  <!-- Top Hero Bar -->
  <rect x="30" y="60" width="740" height="50" rx="10" fill="#161528" stroke="#2B2848" stroke-width="1" />
  <text x="50" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="16">APEX GLOBAL</text>
  <rect x="180" y="78" width="50" height="14" rx="4" fill="#262340" />
  <rect x="245" y="78" width="60" height="14" rx="4" fill="#262340" />
  <rect x="320" y="78" width="55" height="14" rx="4" fill="#262340" />
  <rect x="640" y="72" width="110" height="26" rx="6" fill="url(#purpleGrad)" />
  <text x="695" y="89" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Portal Login</text>

  <!-- Main Hero Graphic in Page -->
  <rect x="30" y="125" width="470" height="210" rx="12" fill="#141424" stroke="#2A2744" stroke-width="1" />
  <text x="55" y="165" fill="#B77AFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" letter-spacing="1">ENTERPRISE CAPITAL & GROWTH</text>
  <text x="55" y="200" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="22">Empowering 400+ Global Markets</text>
  <text x="55" y="228" fill="#9D9CB5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">High-integrity decentralized architecture built for multinational infrastructure.</text>
  
  <rect x="55" y="260" width="135" height="38" rx="8" fill="url(#purpleGrad)" filter="url(#glow)" />
  <text x="122" y="284" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">View Solutions</text>
  <rect x="205" y="260" width="135" height="38" rx="8" fill="#1C1B30" stroke="#363255" stroke-width="1" />
  <text x="272" y="284" fill="#E2E1F0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" text-anchor="middle">Read Annual Report</text>

  <!-- Right Side Interactive Stats Card -->
  <rect x="520" y="125" width="250" height="210" rx="12" fill="#151426" stroke="#2F2B4C" stroke-width="1" />
  <text x="540" y="155" fill="#8E8DA8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Global Transactions</text>
  <text x="540" y="185" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="24">$4.82B</text>
  <text x="635" y="183" fill="#22C55E" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12">+18.4% YoY</text>

  <!-- Graph -->
  <path d="M540 280 Q 580 260 620 270 T 700 210 T 750 195 L 750 295 L 540 295 Z" fill="url(#chartGrad)" />
  <path d="M540 280 Q 580 260 620 270 T 700 210 T 750 195" fill="none" stroke="#8B35FF" stroke-width="3" />
  <circle cx="750" cy="195" r="5" fill="#B77AFF" filter="url(#glow)" />

  <!-- 3 Bottom Metric Tiles -->
  <rect x="30" y="350" width="230" height="120" rx="10" fill="#141424" stroke="#25243B" stroke-width="1" />
  <text x="50" y="380" fill="#B8B8C5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Uptime Reliability</text>
  <text x="50" y="415" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="26">99.99%</text>
  <text x="50" y="445" fill="#8B35FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Tier-4 Sovereign Cloud</text>

  <rect x="285" y="350" width="230" height="120" rx="10" fill="#141424" stroke="#25243B" stroke-width="1" />
  <text x="305" y="380" fill="#B8B8C5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Latency Benchmarks</text>
  <text x="305" y="415" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="26">&lt; 14ms</text>
  <text x="305" y="445" fill="#22C55E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Global Edge Network</text>

  <rect x="540" y="350" width="230" height="120" rx="10" fill="#141424" stroke="#25243B" stroke-width="1" />
  <text x="560" y="380" fill="#B8B8C5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Institutional Grade</text>
  <text x="560" y="415" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="26">ISO 27001</text>
  <text x="560" y="445" fill="#B77AFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">End-to-End Audited</text>
</svg>
