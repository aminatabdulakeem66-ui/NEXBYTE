<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="novaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090812" />
      <stop offset="100%" stop-color="#141126" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#novaBg)" stroke="#27233E" stroke-width="1.5" />

  <!-- Background decorative glows -->
  <circle cx="400" cy="250" r="180" fill="#8B35FF" opacity="0.12" />

  <!-- Center iPhone Mockup Frame -->
  <rect x="270" y="25" width="260" height="450" rx="36" fill="#0C0A17" stroke="#3D375B" stroke-width="4" filter="url(#phoneShadow)" />
  
  <!-- Dynamic Island -->
  <rect x="365" y="38" width="70" height="16" rx="8" fill="#000000" />
  <circle cx="420" cy="46" r="3" fill="#1E1B4B" />

  <!-- Phone Screen Content -->
  <!-- Top Bar -->
  <text x="295" y="75" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">9:41</text>
  <text x="295" y="105" fill="#8F8DAA" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Welcome back,</text>
  <text x="295" y="122" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Alexander Vance</text>
  <circle cx="500" cy="112" r="14" fill="#241E3D" stroke="#5E439B" stroke-width="1" />
  <circle cx="500" cy="112" r="5" fill="#B77AFF" />

  <!-- Virtual Holographic Credit Card -->
  <rect x="290" y="135" width="220" height="120" rx="14" fill="url(#cardGrad)" stroke="#B77AFF" stroke-width="1" />
  <text x="305" y="160" fill="#E9D5FF" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" letter-spacing="1">NOVAPAY BLACK</text>
  <circle cx="485" cy="160" r="8" fill="#FFC107" opacity="0.8" />
  <circle cx="493" cy="160" r="8" fill="#FF5722" opacity="0.8" />
  
  <text x="305" y="200" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">$38,420.50</text>
  <text x="305" y="235" fill="#D8B4FE" font-family="'Space Grotesk', monospace" font-size="10">•••• 8924 · EXP 09/29</text>

  <!-- 3 Quick Action Round Buttons -->
  <circle cx="325" cy="285" r="20" fill="#211A3D" stroke="#4C3A7A" stroke-width="1" />
  <text x="325" y="290" fill="#B77AFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">↑</text>
  <text x="325" y="318" fill="#8F8DAA" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Send</text>

  <circle cx="400" cy="285" r="20" fill="#8B35FF" />
  <text x="400" y="290" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">↓</text>
  <text x="400" y="318" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Receive</text>

  <circle cx="475" cy="285" r="20" fill="#211A3D" stroke="#4C3A7A" stroke-width="1" />
  <text x="475" y="290" fill="#B77AFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">✦</text>
  <text x="475" y="318" fill="#8F8DAA" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Vault</text>

  <!-- Recent Activity Feed in Phone -->
  <rect x="290" y="335" width="220" height="42" rx="8" fill="#151226" />
  <circle cx="308" cy="356" r="10" fill="#271F44" />
  <text x="326" y="352" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Apple Store</text>
  <text x="326" y="365" fill="#757391" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Hardware purchase</text>
  <text x="495" y="358" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="end">-$1,199</text>

  <rect x="290" y="385" width="220" height="42" rx="8" fill="#151226" />
  <circle cx="308" cy="406" r="10" fill="#271F44" />
  <text x="326" y="402" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Stripe Payout</text>
  <text x="326" y="415" fill="#757391" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Client invoice #809</text>
  <text x="495" y="408" fill="#22C55E" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="end">+$6,400</text>

  <!-- Left Callout on Big Screen -->
  <rect x="40" y="160" width="195" height="140" rx="12" fill="#141124" stroke="#362E58" stroke-width="1" />
  <text x="55" y="190" fill="#B77AFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">HAPTIC BIOMETRICS</text>
  <text x="55" y="215" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Sub-Second FaceID</text>
  <text x="55" y="240" fill="#8F8DAA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Zero friction transactions with hardware secure enclave encryption.</text>

  <!-- Right Callout on Big Screen -->
  <rect x="565" y="160" width="195" height="140" rx="12" fill="#141124" stroke="#362E58" stroke-width="1" />
  <text x="580" y="190" fill="#22C55E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">AI SMART VAULTS</text>
  <text x="580" y="215" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Automated Round-ups</text>
  <text x="580" y="240" fill="#8F8DAA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Surplus capital swept automatically into high-yield liquidity pools.</text>
</svg>
